http:
  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      entryPoints:
        - web
      service: auth-service
      middlewares:
        - auth-strip-prefix

    threat-router:
      rule: "PathPrefix(`/api/threat`)"
      entryPoints:
        - web
      service: threat-service
      middlewares:
        - threat-strip-prefix

    report-router:
      rule: "PathPrefix(`/api/report`)"
      entryPoints:
        - web
      service: report-service
      middlewares:
        - report-strip-prefix

  services:
    auth-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:8081"

    threat-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:8000"

    report-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:8090"

  middlewares:
    auth-strip-prefix:
      stripPrefix:
        prefixes:
          - "/api/auth"

    threat-strip-prefix:
      stripPrefix:
        prefixes:
          - "/api/threat"

    report-strip-prefix:
      stripPrefix:
        prefixes:
          - "/api/report"