apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: threatguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alexanderpwned/threatguard-frontend:latest
          ports:
            - containerPort: 80