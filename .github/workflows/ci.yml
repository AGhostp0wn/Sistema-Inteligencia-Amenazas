name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main
      - pruebas

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-auth:latest

      - name: Build y Push threat-service
        uses: docker/build-push-action@v5
        with:
          context: ./threat-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-threat:latest

      - name: Build y Push report-service
        uses: docker/build-push-action@v5
        with:
          context: ./report-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-report:latest

      - name: Build y Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./threatguard-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-frontend:latest

  deploy-to-aws:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Agregar host AWS
        run: |
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy K3s
        run: |
          ssh ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} "
            /usr/local/bin/kubectl rollout restart deployment/auth-service -n threatguard &&
            /usr/local/bin/kubectl rollout restart deployment/threat-service -n threatguard &&
            /usr/local/bin/kubectl rollout restart deployment/report-service -n threatguard &&
            /usr/local/bin/kubectl rollout restart deployment/frontend -n threatguard
          "