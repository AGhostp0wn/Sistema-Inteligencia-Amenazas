name: CI — Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-auth:latest

      - name: Build y Push threat-service
        uses: docker/build-push-action@v5
        with:
          context: ./threat-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-threat:latest

      - name: Build y Push report-service
        uses: docker/build-push-action@v5
        with:
          context: ./report-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-report:latest

      - name: Build y Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./threatguard-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/threatguard-frontend:latest