# application.properties

# Server Configuration
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/threatguard_db
spring.datasource.username=${POSTGRES_USER:threatguard_user}
spring.datasource.password=${POSTGRES_PASSWORD:supersecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configurationdas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (se usará más adelante)
# Debe ser >= 32 bytes para HS256 (RFC7518). En producción usa Secret/ENV.
jwt.secret=${JWT_SECRET:change-me-in-env-for-real-change-me-in-env-for-real-32bytes-min}
# 24 horas
jwt.expiration-ms=86400000
